ServerRoot "/usr/local/apache2"

# Puerto configurable via variable de entorno SERVER_PORT (default 80)
Listen ${SERVER_PORT}

# Módulos esenciales
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule headers_module modules/mod_headers.so
LoadModule alias_module modules/mod_alias.so

# Identidad del servidor
ServerName ${SERVER_NAME}
ServerAdmin webmaster@localhost

# Deshabilitar banner de versión (seguridad)
ServerTokens Prod
ServerSignature Off

# Directorio de documentos
DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
</Directory>

# Tipos MIME comunes
TypesConfig conf/mime.types
AddType text/html .html .htm
AddType text/css  .css
AddType application/javascript .js
AddType image/png .png
AddType image/jpeg .jpg .jpeg
AddType image/svg+xml .svg

# Headers útiles para el proxy/cache
Header always set X-Served-By "apache-server-ic7602"
Header always set Cache-Control "public, max-age=300"

# Logs a stdout/stderr para que Kubernetes los recoja
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

# Nivel de log
LogLevel warn