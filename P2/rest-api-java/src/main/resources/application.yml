spring:
  application:
    name: rest-api-java

  # H2 en memoria: simple y reproducible para revisión.
  datasource:
    url: jdbc:h2:mem:itemsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update      # Crea/actualiza schema al arrancar
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false

  # H2 console habilitada solo en perfil dev — útil en demo, no en producción.
  h2:
    console:
      enabled: false
      path: /h2-console

server:
  port: ${SERVER_PORT:8081}
  # Mejor stack traces ocultos en errores 500: no se debe filtrar info interna.
  error:
    include-stacktrace: never
    include-message: always

# Endpoints de Actuator que K8s liveness/readiness consumirán.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging: nivel sensato para producción; subir a DEBUG en desarrollo si hace falta.
logging:
  level:
    root: INFO
    cr.tec.ic7602: INFO
    org.hibernate.SQL: WARN

# Configuración CORS leída por CorsConfig.
# En K8s/Helm se sobrescribe via env var CORS_ALLOWED_ORIGINS.
app:
  cors:
    allowed-origins: "*"
