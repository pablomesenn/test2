[package]
name = "dns-interceptor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dns-interceptor"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
maxminddb = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio-test = "0.4"