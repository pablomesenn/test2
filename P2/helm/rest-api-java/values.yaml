# Configuración default del chart rest-api-java.
# Sobreescribir con `helm install ... -f values-prod.yaml` o `--set`.

replicaCount: 1

image:
  repository: rest-api-java
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081

# Recursos pensados para correr en minikube/kind local.
# En cluster real, ajustar según carga esperada.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Variables de entorno pasadas al contenedor.
env:
  SERVER_PORT: "8081"
  # Restringir a los orígenes reales en producción.
  CORS_ALLOWED_ORIGINS: "*"
  SPRING_PROFILES_ACTIVE: ""

# Probes apuntan a Actuator (más confiable que /api/health en arranque).
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

# Etiquetas adicionales aplicadas a todos los recursos.
labels:
  app.kubernetes.io/part-of: ic7602-p2
  app.kubernetes.io/component: rest-api-java
