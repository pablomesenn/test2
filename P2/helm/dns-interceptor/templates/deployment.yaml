apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dns
  namespace: {{ .Release.Namespace }}
  labels:
    app: dns-interceptor
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: dns-interceptor
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: dns-interceptor
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: dns-interceptor
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 53
              protocol: UDP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-dns-config
          volumeMounts:
            - name: geoip-db
              mountPath: /app/geoip
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: geoip-db
          hostPath:
            path: /app/geoip
            type: DirectoryOrCreate
