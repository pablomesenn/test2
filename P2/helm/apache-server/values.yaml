replicaCount: 1

image:
  repository: apache-server
  tag: dev
  pullPolicy: Never   # Usa imagen local de minikube (para desarrollo)

service:
  type: ClusterIP
  port: 80

# Variables de entorno inyectadas al contenedor (sin hardcoding)
env:
  SERVER_NAME: "apache-server.local"
  SERVER_PORT: "80"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Etiquetas adicionales aplicadas a todos los recursos
labels:
  app.kubernetes.io/part-of: ic7602-p2
  app.kubernetes.io/component: apache-server