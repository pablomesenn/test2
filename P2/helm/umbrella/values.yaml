# values.yaml del umbrella chart ic7602-p2
#
# Todos los valores configurables están aquí — sin nada quemado en código.
# Para sobreescribir en deploy:
#   helm install p2 ./helm/umbrella -f mis-valores.yaml
#   helm install p2 ./helm/umbrella --set dns-interceptor.config.upstreamDns=1.1.1.1:53

# ─────────────────────────────────────────────
# DNS Interceptor
# ─────────────────────────────────────────────
dns-interceptor:
  replicaCount: 1

  image:
    repository: dns-interceptor
    tag: dev
    pullPolicy: Never

  service:
    port: 53
    protocol: UDP

  config:
    listenAddr: "0.0.0.0:53"
    upstreamDns: "8.8.8.8:53"
    defaultZone: "10.0.0.99"
    # Mapeo país → IP de la Zonal Cache correspondiente
    # Formato: "CR=<IP_CACHE_CR>,US=<IP_CACHE_US>"
    zoneMap: "CR=10.0.0.2,US=10.0.0.1"
    # Dominios interceptados (separados por coma)
    managedDomains: "midominio.test,ejemplo.test"
    geoipPath: "/app/geoip/dbip-country-lite.mmdb"

  geoip:
    hostPath: ""

# ─────────────────────────────────────────────
# Zonal Cache
# ─────────────────────────────────────────────
zonal-cache:
  replicaCount: 1

  image:
    repository: zonal-cache
    tag: dev
    pullPolicy: Never

  service:
    port: 8080
    protocol: TCP

  config:
    listenAddr: "0.0.0.0:8080"
    cacheDir: "/app/cache_data"
    cacheMaxSizeBytes: "104857600"   # 100 MB
    cachePolicy: "LRU"
    firebaseProjectId: "ic7602-p2-79108"
    # URL del Node API desplegado en Vercel
    nodeApiUrl: "https://2026-01-ic-7602.vercel.app/api"
    # API keys de arranque — format "key:user,key2:user2"
    bootstrapApiKeys: "test-key-123:admin"

  persistence:
    enabled: true
    size: 1Gi
    storageClass: "standard"

  # Contenido del firebase-service-account.json en base64
  # Generar con: base64 -w0 firebase-service-account.json
  firebaseServiceAccount: ""

# ─────────────────────────────────────────────
# REST API Java
# ─────────────────────────────────────────────
rest-api-java:
  replicaCount: 1

  image:
    repository: rest-api-java
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8081

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env:
    SERVER_PORT: "8081"
    CORS_ALLOWED_ORIGINS: "*"
    SPRING_PROFILES_ACTIVE: ""

  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5

  labels:
    app.kubernetes.io/part-of: ic7602-p2
    app.kubernetes.io/component: rest-api-java

# ─────────────────────────────────────────────
# Apache Server
# ─────────────────────────────────────────────
apache-server:
  replicaCount: 1

  image:
    repository: apache-server
    tag: dev
    pullPolicy: Never

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  env:
    SERVER_NAME: "apache-server.local"
    SERVER_PORT: "80"

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5

  labels:
    app.kubernetes.io/part-of: ic7602-p2
    app.kubernetes.io/component: apache-server