[package]
name = "zonal-cache"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zonal-cache"
path = "src/main.rs"

[lib]
name = "zonal_cache"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
reqwest = { version = "0.12", features = ["rustls-tls", "stream"] }
firestore = "0.44"
rand = "0.8"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
url = "2"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.5"
tempfile = "3"